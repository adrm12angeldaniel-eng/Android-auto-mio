name: Android CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Compilar APK
      run: ./gradlew assembleDebug
      
