name: Convertir HTML a APK

on:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Cordova y crear proyecto
        run: |
          npm install -g cordova
          cordova create app_cordova com.mihtml.app MiAppHTML
          # Copiar tus archivos HTML a la carpeta del proyecto
          cp -r * app_cordova/www/ || true
          cd app_cordova
          cordova platform add android@12.0.0
          cordova build android --debug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MiApp-APK
          path: app_cordova/platforms/android/app/build/outputs/apk/debug/app-debug.apk

          name: Build Android APK from Web

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js (v18)
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Configurar Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Preparar proyecto Web y Capacitor
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        # Si tu archivo se llama Android.html o index.html, aseguramos index.html
        if [ -f "Android.html" ] && [ ! -f "index.html" ]; then
          cp Android.html index.html
        fi
        npx cap init "HondaLauncher" "com.honda.launcher" --web-dir .
        npx cap add android
        npx cap sync

    - name: Configurar permisos de Gradle en Android
      run: |
        cd android
        chmod +x gradlew

    - name: Compilar la APK con Gradle
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Subir archivo APK listo para instalar
      uses: actions/upload-artifact@v4
      with:
        name: Honda-Launcher-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
